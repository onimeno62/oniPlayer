name: Temporary Playback Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[playback-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted playback repairs
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) When SET_QUEUE and PLAY_SONG arrive very close together, preserve the
          #    already-requested current item if it exists in the incoming queue.
          replace(
              'app/src/main/java/com/example/playback/PlaybackController.kt',
              '''        val sourceIndex = startIndex.coerceIn(0, songs.lastIndex)\n        preparing = true\n        player.setMediaItems(songs.map(::mediaItem), sourceIndex, 0L)''',
              '''        val sourceIndex = startIndex.coerceIn(0, songs.lastIndex)\n        val existingCurrentId = player.currentMediaItem?.mediaId\n        val effectiveIndex = if (playImmediately && existingCurrentId != null) {\n            songs.indexOfFirst { it.id == existingCurrentId }.takeIf { it >= 0 } ?: sourceIndex\n        } else sourceIndex\n        preparing = true\n        player.setMediaItems(songs.map(::mediaItem), effectiveIndex, 0L)'''
          )

          # 2) Avoid O(n²) queue reconstruction on every publish. This is especially
          #    expensive immediately after shuffle/repeat changes.
          replace(
              'app/src/main/java/com/example/playback/PlaybackController.kt',
              '''    private fun currentQueue(): List<SongEntity> = (0 until player.mediaItemCount).mapNotNull { i -> _state.value.queue.find { it.id == player.getMediaItemAt(i).mediaId } }''',
              '''    private fun currentQueue(): List<SongEntity> {\n        val byId = _state.value.queue.associateBy { it.id }\n        return (0 until player.mediaItemCount).mapNotNull { i -> byId[player.getMediaItemAt(i).mediaId] }\n    }'''
          )

          # 3) Make MediaController command serialization real: wait until the service
          #    has accepted/completed each custom command before releasing the client mutex.
          p = Path('app/src/main/java/com/example/playback/PlaybackControllerClient.kt')
          text = p.read_text()
          text = text.replace(
              'import kotlinx.coroutines.withContext\n',
              'import kotlinx.coroutines.withContext\nimport kotlinx.coroutines.suspendCancellableCoroutine\nimport kotlin.coroutines.resume\n'
          )
          old = '''    private fun command(action: String, args: Bundle = Bundle()) { scope.launch { commandMutex.withLock { runCatching { ready.await().sendCustomCommand(SessionCommand(action, Bundle.EMPTY), args) } } } }'''
          new = '''    private fun command(action: String, args: Bundle = Bundle()) {\n        scope.launch {\n            commandMutex.withLock {\n                runCatching {\n                    val c = ready.await()\n                    val future = c.sendCustomCommand(SessionCommand(action, Bundle.EMPTY), args)\n                    suspendCancellableCoroutine<Unit> { continuation ->\n                        future.addListener({\n                            if (continuation.isActive) continuation.resume(Unit)\n                        }, ContextCompat.getMainExecutor(appContext))\n                        continuation.invokeOnCancellation { future.cancel(true) }\n                    }\n                }\n            }\n        }\n    }'''
          if old not in text:
              raise SystemExit('Expected command() source pattern not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # 4) Reduce transition/UI latency by publishing the controller's immediate
          #    state from the cached queue before doing any Room refresh.
          old = '''    private fun refreshState() {\n        val c = controller ?: return\n        scope.launch {\n            stateMutex.withLock {\n                val ids = (0 until c.mediaItemCount).map { c.getMediaItemAt(it).mediaId }\n                val currentId = c.currentMediaItem?.mediaId\n                val (currentSongEntity, queueSongs) = withContext(Dispatchers.IO) {\n                    val dao = database.songDao(); val current = currentId?.let { dao.getSongById(it) }\n                    val songs = if (ids == cachedQueueIds) cachedQueueSongs.map { if (it.id == currentId && current != null) current else it }\n                    else { val byId = dao.getSongsByIds(ids).associateBy { it.id }; val fetched = ids.mapNotNull { byId[it] }; cachedQueueIds = ids; cachedQueueSongs = fetched; fetched }\n                    current to songs\n                }\n                val logicalRepeat = if (c.repeatMode == Player.REPEAT_MODE_ONE) RepeatMode.ONE else RepeatMode.ALL\n                val posVal = c.currentPosition.coerceAtLeast(0)\n                _state.value = _state.value.copy(currentSong = currentSongEntity ?: queueSongs.find { it.id == currentId }, isPlaying = c.isPlaying, positionMs = posVal, durationMs = c.duration.takeIf { it != androidx.media3.common.C.TIME_UNSET && it >= 0 } ?: 0, bufferedPositionMs = c.bufferedPosition.coerceAtLeast(0), shuffleEnabled = c.shuffleModeEnabled, repeatMode = logicalRepeat, queue = queueSongs)\n                _position.value = posVal\n            }\n        }\n    }'''
          new = '''    private fun refreshState() {\n        val c = controller ?: return\n        val ids = (0 until c.mediaItemCount).map { c.getMediaItemAt(it).mediaId }\n        val currentId = c.currentMediaItem?.mediaId\n        val logicalRepeat = if (c.repeatMode == Player.REPEAT_MODE_ONE) RepeatMode.ONE else RepeatMode.ALL\n        val posVal = c.currentPosition.coerceAtLeast(0)\n        val durationVal = c.duration.takeIf { it != androidx.media3.common.C.TIME_UNSET && it >= 0 } ?: 0\n        val bufferedVal = c.bufferedPosition.coerceAtLeast(0)\n\n        // Publish immediately when the queue is already cached. Do not put a Room read\n        // in front of a playback transition reaching Compose.\n        if (ids == cachedQueueIds && cachedQueueSongs.isNotEmpty()) {\n            val current = cachedQueueSongs.find { it.id == currentId }\n            _state.value = _state.value.copy(\n                currentSong = current ?: _state.value.currentSong,\n                isPlaying = c.isPlaying,\n                positionMs = posVal,\n                durationMs = durationVal,\n                bufferedPositionMs = bufferedVal,\n                shuffleEnabled = c.shuffleModeEnabled,\n                repeatMode = logicalRepeat,\n                queue = cachedQueueSongs\n            )\n            _position.value = posVal\n        }\n\n        scope.launch {\n            stateMutex.withLock {\n                val (currentSongEntity, queueSongs) = withContext(Dispatchers.IO) {\n                    val dao = database.songDao()\n                    val current = currentId?.let { dao.getSongById(it) }\n                    val songs = if (ids == cachedQueueIds && cachedQueueSongs.isNotEmpty()) {\n                        cachedQueueSongs.map { if (it.id == currentId && current != null) current else it }\n                    } else {\n                        val byId = dao.getSongsByIds(ids).associateBy { it.id }\n                        val fetched = ids.mapNotNull { byId[it] }\n                        cachedQueueIds = ids\n                        cachedQueueSongs = fetched\n                        fetched\n                    }\n                    current to songs\n                }\n                val latest = controller ?: return@withLock\n                val latestId = latest.currentMediaItem?.mediaId\n                if (latestId != currentId) return@withLock\n                val latestPosition = latest.currentPosition.coerceAtLeast(0)\n                val latestDuration = latest.duration.takeIf { it != androidx.media3.common.C.TIME_UNSET && it >= 0 } ?: 0\n                _state.value = _state.value.copy(\n                    currentSong = currentSongEntity ?: queueSongs.find { it.id == currentId },\n                    isPlaying = latest.isPlaying,\n                    positionMs = latestPosition,\n                    durationMs = latestDuration,\n                    bufferedPositionMs = latest.bufferedPosition.coerceAtLeast(0),\n                    shuffleEnabled = latest.shuffleModeEnabled,\n                    repeatMode = if (latest.repeatMode == Player.REPEAT_MODE_ONE) RepeatMode.ONE else RepeatMode.ALL,\n                    queue = queueSongs\n                )\n                _position.value = latestPosition\n            }\n        }\n    }'''
          if old not in text:
              raise SystemExit('Expected refreshState() source pattern not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # 5) Keep the queue list keyed and show the live position for the current song.
          p = Path('app/src/main/java/com/example/ui/screens/PlayerScreen.kt')
          text = p.read_text()
          text = text.replace(
              'itemsIndexed(playlist) { index, item ->',
              'itemsIndexed(playlist, key = { _, item -> item.id }) { index, item ->',
              1
          )
          old = '''                                                Text(\n                                                    text = item.customArtist ?: item.artist,\n                                                    fontSize = 11.sp,\n                                                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                                                    maxLines = 1,\n                                                    overflow = TextOverflow.Ellipsis\n                                                )'''
          new = '''                                                Text(\n                                                    text = item.customArtist ?: item.artist,\n                                                    fontSize = 11.sp,\n                                                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                                                    maxLines = 1,\n                                                    overflow = TextOverflow.Ellipsis\n                                                )\n                                                if (isCurrent) {\n                                                    val currentSeconds = (position / 1000L).coerceAtLeast(0L)\n                                                    val totalSeconds = (duration / 1000L).coerceAtLeast(0L)\n                                                    val currentText = String.format(java.util.Locale.US, "%d:%02d", currentSeconds / 60, currentSeconds % 60)\n                                                    val totalText = String.format(java.util.Locale.US, "%d:%02d", totalSeconds / 60, totalSeconds % 60)\n                                                    Text(\n                                                        text = "$currentText / $totalText",\n                                                        fontSize = 10.sp,\n                                                        color = accentColor.copy(alpha = 0.75f),\n                                                        maxLines = 1\n                                                    )\n                                                }'''
          if old not in text:
              raise SystemExit('Expected queue artist Text pattern not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Verify targeted source changes
        run: |
          grep -n "effectiveIndex\|private fun currentQueue" app/src/main/java/com/example/playback/PlaybackController.kt
          grep -n "suspendCancellableCoroutine\|private fun command" app/src/main/java/com/example/playback/PlaybackControllerClient.kt
          grep -n "itemsIndexed(playlist, key\|currentText" app/src/main/java/com/example/ui/screens/PlayerScreen.kt

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/playback/PlaybackController.kt app/src/main/java/com/example/playback/PlaybackControllerClient.kt app/src/main/java/com/example/ui/screens/PlayerScreen.kt
          git commit -m "fix: stabilize playback selection and responsiveness [playback-repair]"
          git rm .github/workflows/_playback_repair.yml
          git commit -m "chore: remove temporary playback repair workflow [playback-repair]"
          git push origin main
