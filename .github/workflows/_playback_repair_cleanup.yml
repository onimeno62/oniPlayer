name: Temporary Playback Repair Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[selection-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct selected item target
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/playback/PlaybackController.kt')
          text = p.read_text()
          text = text.replace(
              'player.setShuffleOrder(buildShuffleOrder(songs, songs[sourceIndex].id))',
              'player.setShuffleOrder(buildShuffleOrder(songs, songs[effectiveIndex].id))',
              1
          )
          text = text.replace(
              'scope.launch { recordPlay(songs[sourceIndex].id) }',
              'scope.launch { recordPlay(songs[effectiveIndex].id) }',
              1
          )
          p.write_text(text)
          PY
          grep -n "buildShuffleOrder(songs, songs\[effectiveIndex\]\|recordPlay(songs\[effectiveIndex\]" app/src/main/java/com/example/playback/PlaybackController.kt
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/playback/PlaybackController.kt
          git commit -m "fix: preserve selected playback target after queue synchronization [selection-cleanup]"
          git rm .github/workflows/_playback_repair_cleanup.yml
          git commit -m "chore: remove temporary selection repair workflow [selection-cleanup]"
          git push origin main
