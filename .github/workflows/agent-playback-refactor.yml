name: agent-playback-refactor

on:
  push:
    branches:
      - refactor/playback-architecture-media3

permissions:
  contents: write

jobs:
  patch-current-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/playback-architecture-media3
          fetch-depth: 0

      - name: Patch current source without replacing unrelated changes
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def once(path, old, new):
              p = root / path
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Missing expected text in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          def rx(path, pattern, repl):
              p = root / path
              s = p.read_text()
              ns, n = re.subn(pattern, repl, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Missing expected pattern in {path}: {pattern[:100]!r}')
              p.write_text(ns)

          vm = 'app/src/main/java/com/example/ui/viewmodel/MusicPlayerViewModel.kt'
          once(vm, 'import com.example.playback.OniAudioEngine\n', 'import com.example.playback.PlaybackControllerClient\nimport com.example.playback.ShuffleMode\nimport com.example.playback.RepeatMode\n')
          rx(vm, r'\nenum class ShuffleMode \{.*?\n\}\n\nclass MusicPlayerViewModel', '\nclass MusicPlayerViewModel')
          once(vm, 'val audioEngine = OniAudioEngine.getInstance(application)', 'val audioEngine = PlaybackControllerClient(application)')
          once(vm, '''    // Active playlist being played\n    private val _currentPlaylist = MutableStateFlow<List<SongEntity>>(emptyList())\n    val currentPlaylist: StateFlow<List<SongEntity>> = _currentPlaylist.asStateFlow()''', '''    // Queue is projected from the service-owned playback controller.\n    val currentPlaylist: StateFlow<List<SongEntity>> = audioEngine.queue''')
          rx(vm, r'    // Shuffle and Repeat modes\n.*?    val shuffleMode: StateFlow<ShuffleMode> = _shuffleMode\.asStateFlow\(\)\n', '''    // Playback modes are projections of the service-owned controller.\n    val isShuffle: StateFlow<Boolean> = audioEngine.isShuffle\n    val shuffleMode: StateFlow<ShuffleMode> = audioEngine.shuffleMode\n    val isRepeat: StateFlow<Boolean> = audioEngine.repeatMode.map { it == RepeatMode.ONE }\n        .stateIn(viewModelScope, SharingStarted.Eagerly, false)\n''')
          once(vm, '''    private val _playbackDelayCountdown = MutableStateFlow<Int?>(null)\n    val playbackDelayCountdown: StateFlow<Int?> = _playbackDelayCountdown.asStateFlow()\n\n    private var delayJob: Job? = null\n''', '''    val playbackDelayCountdown: StateFlow<Int?> = audioEngine.autoNextCountdown\n''')
          once(vm, '        activeInstance = this\n', '')
          once(vm, '''        // Listen to completion of song to auto-skip\n        audioEngine.onPlaybackCompleted = {\n            triggerAutoNextWithDelay()\n        }\n''', '')
          once(vm, '''                _currentPlaylist.value = initialSongs\n                \n                // Find last played song (highest lastPlayedTimestamp > 0)\n                val lastPlayedSong = initialSongs.filter { it.lastPlayedTimestamp > 0 }\n                    .maxByOrNull { it.lastPlayedTimestamp } ?: initialSongs.first()\n                \n                // Pre-load metadata into audioEngine without playing\n                audioEngine.setSongWithoutPlaying(lastPlayedSong)''', '''                val lastPlayedSong = initialSongs.filter { it.lastPlayedTimestamp > 0 }\n                    .maxByOrNull { it.lastPlayedTimestamp } ?: initialSongs.first()\n                val lastPlayedIndex = initialSongs.indexOfFirst { it.id == lastPlayedSong.id }.coerceAtLeast(0)\n                audioEngine.setQueue(initialSongs, lastPlayedIndex, false)''')

          playback = '''    // --- Media Playback Controls ---\n\n    fun playSong(song: SongEntity, playlist: List<SongEntity>) {\n        cancelDelay()\n        _currentTab.value = 1\n        _playedCategoryIndex.value = _activeCategoryIndex.value\n        _playedSelectedGroup.value = _selectedGroup.value\n        _playedActivePlaylist.value = _activePlaylist.value\n        _playedActiveSmartPlaylistType.value = _activeSmartPlaylistType.value\n        viewModelScope.launch {\n            val dbSong = database.songDao().getSongById(song.id) ?: song\n            val startIndex = playlist.indexOfFirst { it.id == dbSong.id }.coerceAtLeast(0)\n            audioEngine.setQueue(playlist, startIndex, true)\n        }\n    }\n\n    fun playSongById(songId: String) {\n        viewModelScope.launch {\n            val song = database.songDao().getSongById(songId) ?: return@launch\n            val playlist = currentPlaylist.value.ifEmpty { database.songDao().getAllSongs().firstOrNull() ?: emptyList() }\n            playSong(song, playlist)\n        }\n    }\n\n    fun playNext(song: SongEntity) = audioEngine.playNext(song)\n    fun addToQueue(song: SongEntity) = audioEngine.addToQueue(song)\n\n    fun togglePlayPause() { cancelDelay(); audioEngine.togglePlayPause() }\n    fun skipNext() { cancelDelay(); audioEngine.next() }\n    fun skipPrevious() { cancelDelay(); audioEngine.previous() }\n\n    fun toggleShuffle() = audioEngine.setShuffle(!isShuffle.value, shuffleMode.value)\n    fun setShuffleMode(mode: ShuffleMode) = audioEngine.setShuffle(true, mode)\n    fun shuffleAndPlay(songs: List<SongEntity>) {\n        if (songs.isEmpty()) return\n        audioEngine.setShuffle(true, shuffleMode.value)\n        audioEngine.setQueue(songs, 0, true)\n    }\n    fun toggleRepeat() = audioEngine.setRepeat(!isRepeat.value)\n\n'''
          rx(vm, r'    // --- Media Playback Controls ---\n.*?\n    fun toggleFavorite\(songId: String\) \{', playback + '    fun toggleFavorite(songId: String) {')
          once(vm, '''    fun toggleFavorite(songId: String) {\n        viewModelScope.launch {\n            repository.toggleFavorite(songId)\n        }\n    }''', '''    fun toggleFavorite(songId: String) {\n        viewModelScope.launch {\n            repository.toggleFavorite(songId)\n            database.songDao().getSongById(songId)?.let { audioEngine.updateCurrentSongMetadata(it) }\n        }\n    }''')
          once(vm, '''    fun setNextSongDelaySeconds(seconds: Int) {\n        _nextSongDelaySeconds.value = seconds\n        viewModelScope.launch(Dispatchers.IO) {\n            try {\n                getApplication<Application>().dataStore.edit { preferences ->\n                    preferences[PLAYBACK_DELAY_KEY] = seconds\n                }\n            } catch (e: Exception) {\n                Log.e(TAG, "Error saving next song delay preference: ${e.message}")\n            }\n        }\n    }''', '''    fun setNextSongDelaySeconds(seconds: Int) {\n        _nextSongDelaySeconds.value = seconds\n        audioEngine.setAutoNextDelay(seconds)\n        viewModelScope.launch(Dispatchers.IO) {\n            try {\n                getApplication<Application>().dataStore.edit { preferences ->\n                    preferences[PLAYBACK_DELAY_KEY] = seconds\n                }\n            } catch (e: Exception) {\n                Log.e(TAG, "Error saving next song delay preference: ${e.message}")\n            }\n        }\n    }''')
          once(vm, '''    fun cancelDelay() {\n        delayJob?.cancel()\n        delayJob = null\n        _playbackDelayCountdown.value = null\n    }\n\n    fun triggerAutoNextWithDelay() {\n        cancelDelay()\n        val delaySecs = _nextSongDelaySeconds.value\n        if (delaySecs <= 0) {\n            skipNext()\n            return\n        }\n        delayJob = viewModelScope.launch {\n            for (remaining in delaySecs downTo 1) {\n                _playbackDelayCountdown.value = remaining\n                kotlinx.coroutines.delay(1000)\n            }\n            _playbackDelayCountdown.value = null\n            delayJob = null\n            skipNext()\n        }\n    }''', '''    fun cancelDelay() = audioEngine.cancelPendingNext()\n    fun triggerAutoNextWithDelay() = audioEngine.triggerAutoNextWithDelay()''')
          rx(vm, r'    override fun onCleared\(\) \{.*?\n    companion object \{.*?\n    \}\n\}', '''    override fun onCleared() {\n        karaokeMicEngine.stopMic()\n        audioEngine.release()\n        super.onCleared()\n    }\n}''')

          fl = 'app/src/main/java/com/example/playback/FloatingLyricsService.kt'
          once(fl, 'import com.example.ui.viewmodel.MusicPlayerViewModel\n', '')
          once(fl, '    private val serviceScope = CoroutineScope(Dispatchers.Main + SupervisorJob())\n', '    private val serviceScope = CoroutineScope(Dispatchers.Main + SupervisorJob())\n    private lateinit var playbackController: PlaybackControllerClient\n')
          once(fl, '''        windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager\n        setupOverlay()\n        observePlayback()''', '''        windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager\n        playbackController = PlaybackControllerClient(this)\n        setupOverlay()\n        observePlayback()''')
          for old, new in [
              ('MusicPlayerViewModel.activeInstance?.setFloatingLyricsEnabled(false)', 'stopSelf()'),
              ('MusicPlayerViewModel.activeInstance?.togglePlayPause()', 'playbackController.togglePlayPause()'),
              ('MusicPlayerViewModel.activeInstance?.skipNext()', 'playbackController.next()'),
              ('MusicPlayerViewModel.activeInstance?.skipPrevious()', 'playbackController.previous()'),
              ('MusicPlayerViewModel.activeInstance?.audioEngine?.seekTo(timestampMs)', 'playbackController.seekTo(timestampMs)')]:
              once(fl, old, new)
          rx(fl, r'    private fun observePlayback\(\) \{.*?\n    \}\n\n    override fun onDestroy\(\)', '''    private fun observePlayback() {\n        serviceScope.launch {\n            combine(playbackController.currentSong, playbackController.position, playbackController.isPlaying) { song, pos, playing -> Triple(song, pos, playing) }\n                .collectLatest { (song, pos, playing) ->\n                    currentSong.value = song\n                    position.value = pos\n                    isPlaying.value = playing\n                }\n        }\n    }\n\n    override fun onDestroy()''')
          once(fl, '''    override fun onDestroy() {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_DESTROY)''', '''    override fun onDestroy() {\n        playbackController.release()\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_DESTROY)''')

          lib = 'app/src/main/java/com/example/ui/screens/LibraryScreen.kt'
          rx(lib, r'            onShuffleAll = \{\n                if \(songs\.isNotEmpty\(\)\) \{.*?\n                \} else \{', '''            onShuffleAll = {\n                if (songs.isNotEmpty()) {\n                    viewModel.shuffleAndPlay(songs)\n                    Toast.makeText(context, "Shuffling all songs", Toast.LENGTH_SHORT).show()\n                } else {''')

          for p in (root / 'app/src/main/java').rglob('*.kt'):
              if '/ui/' not in str(p):
                  continue
              s = p.read_text()
              if 'audioEngine.' in s and 'collectAsState()' in s:
                  s = s.replace('.collectAsState()', '.collectAsStateWithLifecycle()')
                  if 'androidx.lifecycle.compose.collectAsStateWithLifecycle' not in s:
                      s = s.replace('import androidx.compose.runtime.*\n', 'import androidx.compose.runtime.*\nimport androidx.lifecycle.compose.collectAsStateWithLifecycle\n', 1)
                  p.write_text(s)

          libs = 'gradle/libs.versions.toml'
          once(libs, 'palette = "1.0.0"\n', 'palette = "1.0.0"\nmedia3 = "1.10.1"\n')
          once(libs, 'androidx-palette = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }\n', 'androidx-palette = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }\nandroidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }\nandroidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }\n')
          build = 'app/build.gradle.kts'
          once(build, '  implementation(libs.androidx.palette)\n', '  implementation(libs.androidx.palette)\n  implementation(libs.androidx.media3.exoplayer)\n  implementation(libs.androidx.media3.session)\n')
          dao = 'app/src/main/java/com/example/data/database/SongDao.kt'
          once(dao, '''    @Query("SELECT * FROM songs WHERE id = :songId LIMIT 1")\n    suspend fun getSongById(songId: String): SongEntity?\n''', '''    @Query("SELECT * FROM songs WHERE id = :songId LIMIT 1")\n    suspend fun getSongById(songId: String): SongEntity?\n\n    @Query("SELECT * FROM songs WHERE id IN (:songIds)")\n    suspend fun getSongsByIds(songIds: List<String>): List<SongEntity>\n''')
          manifest = 'app/src/main/AndroidManifest.xml'
          once(manifest, '''        <service\n            android:name=".playback.MusicPlaybackService"\n            android:enabled="true"\n            android:exported="false"\n            android:foregroundServiceType="mediaPlayback" />''', '''        <service\n            android:name=".playback.MusicPlaybackService"\n            android:enabled="true"\n            android:exported="true"\n            android:foregroundServiceType="mediaPlayback">\n            <intent-filter>\n                <action android:name="androidx.media3.session.MediaSessionService" />\n            </intent-filter>\n        </service>''')

          old = root / 'app/src/main/java/com/example/playback/OniAudioEngine.kt'
          if old.exists(): old.unlink()
          print('playback refactor patch complete')
          PY
          python3 /tmp/patch.py
          rm -f .github/workflows/agent-playback-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: move playback ownership to Media3 service [skip ci]"
          git push origin HEAD:refactor/playback-architecture-media3
