name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests + debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Uses the committed Gradle wrapper (gradle/wrapper/gradle-wrapper.properties).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: ./gradlew testDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release-build:
    name: Release build (R8 / resource shrinking check)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      # Throwaway key: only proves the release variant (minify + shrink) builds.
      # Real releases are signed locally with your own upload key.
      - name: Generate throwaway signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass ci-store-pass \
            -keypass ci-key-pass \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=CI Throwaway,O=CI,C=US"

      - name: Assemble release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci-release.jks
          STORE_PASSWORD: ci-store-pass
          KEY_PASSWORD: ci-key-pass
        run: ./gradlew assembleRelease

      - name: Verify no Gemini key in release build config
        run: |
          f=$(find app/build -path '*release*' -name BuildConfig.java | head -1)
          echo "Checking $f"
          grep 'GEMINI_API_KEY' "$f"
          grep -q 'GEMINI_API_KEY = ""' "$f"
