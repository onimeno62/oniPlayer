name: Fix playback ViewModel cleanup

on:
  push:
    branches:
      - refactor/playback-architecture-media3

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 .github/playback_delay_fix.py
          git config user.name "oniPlayer Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/playback-delay-fix.yml .github/playback_delay_fix.py
          git add app/src/main/java/com/example/ui/viewmodel/MusicPlayerViewModel.kt
          git commit -m "fix(playback): remove obsolete ViewModel delay code"
          git push origin HEAD:refactor/playback-architecture-media3
